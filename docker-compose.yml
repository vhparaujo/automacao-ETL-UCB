# MySQL do pipeline ETL Brightspace — UCB
#
# Uso:
#   npm run db:up     → sobe o MySQL em 127.0.0.1:${DB_PORT} (padrão 3307)
#   npm run db:down   → para o container (os dados ficam no volume)
#   npm run db:logs   → acompanha o log do MySQL
#
# Credenciais vêm do .env (o Docker Compose lê o arquivo automaticamente):
#   DB_NAME, DB_USER, DB_PASSWORD, DB_PORT
# A senha de root é gerada aleatoriamente (não é usada pelo pipeline) e aparece
# uma única vez no log da primeira inicialização ("GENERATED ROOT PASSWORD").
#
# local_infile=ON já vem habilitado — necessário para o LOAD DATA LOCAL INFILE do loader.

services:
  mysql:
    image: mysql:8.4
    container_name: etl-ucb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-data_ucb}
      MYSQL_USER: ${DB_USER:-dataUCB}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: America/Sao_Paulo
    command:
      - --local-infile=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Só aceita conexões da própria máquina
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
    name: etl-ucb-mysql-data
